[project]
name = "ragware"
version = "0.1.0"
description = "Retrival Augumented Generation from scratch"
authors = [
    {name = "parth.solanke",email = "parth.solanke@techverito.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "tiktoken (>=0.12.0,<0.13.0)",
    "openai (>=2.2.0,<3.0.0)",
    "numpy (>=2.3.3,<3.0.0)",
    "pydantic (>=2.11.10,<3.0.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "fastapi (>=0.118.0,<0.119.0)",
    "uvicorn (>=0.37.0,<0.38.0)",
    "pandas (>=2.3.3,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
